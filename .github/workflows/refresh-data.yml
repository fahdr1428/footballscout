# Fetch the seasons the GitHub mirrors stopped short of, from the primary
# sources, and commit them. Runs on GitHub's runners because they can reach
# understat.com and the Transfermarkt dataset; see scripts/refresh_sources.py.
name: Refresh data

on:
  workflow_dispatch:
  push:
    branches: [claude/football-scouting-platform-hl53qc]
    paths:
      - .github/workflows/refresh-data.yml
      - scripts/refresh_sources.py

permissions:
  contents: write

concurrency:
  group: refresh-data-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: pip install "pandas>=2.2,<4"

      - name: Fetch Understat and Transfermarkt
        run: python scripts/refresh_sources.py --out data/raw

      - name: Commit what changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add data/raw/live data/raw/tm
          if git diff --cached --quiet; then
            echo "Nothing new upstream."
            exit 0
          fi
          git commit -m "Refresh raw data from Understat and Transfermarkt ($(date -u +%F))"
          git push
