# Keep the public site current. Every day this fetches the seasons the GitHub
# mirrors stopped short of from the primary sources (understat.com, and the
# CC0 Transfermarkt dataset), rebuilds the six-league and Premier League
# datasets, runs the tests, rebuilds the site, checks nothing was lost and that
# the page works in a real browser, and commits - which redeploys it.
# Runs on GitHub's runners because they can reach those hosts; see
# scripts/refresh_sources.py. Disable it from the Actions tab at any time.
name: Refresh data

on:
  workflow_dispatch:
    inputs:
      keeper_seasons:
        description: "Only fetch keepers' matches for these season start years (default: every season since 2014, finished ones once, a little each run)"
        required: false
        default: ""
      keeper_budget:
        description: "Minutes this run may spend on keepers"
        required: false
        default: "15"
  schedule:
    # Every morning at 05:41 UTC, after the previous evening's matches - so this
    # season is at most a day old, and a failed fetch is retried the next day
    # rather than days later. A run that finds nothing new commits nothing.
    - cron: "41 5 * * *"

permissions:
  contents: write

concurrency:
  group: refresh-data-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: pip install -r requirements-dev.txt -c constraints.txt

      - name: Fetch Understat and Transfermarkt
        env:
          KEEPER_SEASONS: ${{ inputs.keeper_seasons }}
          KEEPER_BUDGET: ${{ inputs.keeper_budget || '15' }}
        # Keepers' full matches: the season being played every run, finished
        # seasons since 2014 once each, within the time budget.
        run: |
          extra=""
          if [ -n "$KEEPER_SEASONS" ]; then
            current=$(python -c "import sys; sys.path.insert(0, 'scripts'); import refresh_sources as r; print(' '.join(map(str, r.default_seasons())))")
            extra="--keeper-seasons $KEEPER_SEASONS $current"
          fi
          python scripts/refresh_sources.py --out data/raw --keeper-budget "$KEEPER_BUDGET" $extra

      - name: Rebuild the six-league dataset
        run: python scripts/fetch_understat.py --include-partial --cache /tmp/understat-big6

      - name: Rebuild the Premier League dataset
        # Clones the Fantasy-Premier-League mirror (gameweeks so far included)
        # and rebuilds every season, the one being played too.
        run: python scripts/fetch_premier_league.py --repo /tmp/fantasy-premier-league

      - name: Test
        run: python -m pytest -q

      - name: Cross-check the feeds
        run: python scripts/cross_check.py >> "$GITHUB_STEP_SUMMARY"

      - name: Rebuild the site
        run: python scripts/export_static.py --sources understat_big6 premier_league

      - name: Check nothing was lost
        run: python scripts/check_site.py

      - name: Check the site in a browser
        # GitHub's runners ship Google Chrome, so no browser download is needed.
        run: python scripts/check_ui.py --channel chrome

      - name: Commit and publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add data/raw static
          # The fetch stamps alone are not news: commit (and redeploy) only when
          # a dataset or the site changed.
          if git diff --cached --quiet -- . ':(exclude)data/raw/live/*_meta.json'; then
            echo "Nothing new upstream."
            exit 0
          fi
          git commit -m "Daily data refresh ($(date -u +%F))"
          # A push to this branch while the refresh ran would reject ours: put the
          # refresh on top of it and try again. A conflict fails the run, and the
          # next morning's starts from the new branch.
          for attempt in 1 2 3; do
            git push && exit 0
            git pull --rebase origin "$GITHUB_REF_NAME" || { git rebase --abort; exit 1; }
          done
          exit 1
