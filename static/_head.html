<title>Who Plays Like Him</title>
<meta name="description" content="Find statistically similar footballers, build a scouting profile, and rank players on any metric - with the arithmetic behind every number.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%2312456B'/%3E%3Cpath d='M16 6l4 3-1.5 5h-5L12 9z M9 14l4 1 1 5-3 3-4-2z M23 14l2 7-4 2-3-3 1-5z' fill='%23fff'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --ground:#EEF1F0; --surface:#FFFFFF; --raised:#F7F9F8; --sunken:#E6EBE9;
  --ink:#101816; --ink-2:#3C4A46; --muted:#627570; --line:#D8E0DD; --line-2:#C3CFCB;
  --accent:#12456B; --accent-soft:#E4EDF4; --on-accent:#FFFFFF;
  --second:#B4540F; --second-soft:#FBEDE1;
  --s5:#1B7F4B; --s4:#4E8F3F; --s3:#8A8A5E; --s2:#B26A00; --s1:#B3261E;
  --shadow:0 1px 2px rgba(16,24,22,.06),0 8px 24px rgba(16,24,22,.07);
  --r:10px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#0C1211; --surface:#131C1A; --raised:#18231F; --sunken:#0F1716;
  --ink:#E9EFEC; --ink-2:#BCC9C4; --muted:#8CA09A; --line:#243330; --line-2:#33443F;
  --accent:#69B4DC; --accent-soft:#15303F; --on-accent:#08161D;
  --second:#F0A15E; --second-soft:#3A2614;
  --s5:#4FC98A; --s4:#8CC96B; --s3:#B9B57E; --s2:#E0913A; --s1:#E4685C;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --ground:#0C1211; --surface:#131C1A; --raised:#18231F; --sunken:#0F1716;
  --ink:#E9EFEC; --ink-2:#BCC9C4; --muted:#8CA09A; --line:#243330; --line-2:#33443F;
  --accent:#69B4DC; --accent-soft:#15303F; --on-accent:#08161D;
  --second:#F0A15E; --second-soft:#3A2614;
  --s5:#4FC98A; --s4:#8CC96B; --s3:#B9B57E; --s2:#E0913A; --s1:#E4685C;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--ground);color:var(--ink);
  font-family:"IBM Plex Sans",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;
}
.wrap{max-width:1360px;margin:0 auto;padding-inline:16px;padding-block:22px 44px}
@media (min-width:700px){.wrap{padding-inline:22px}}
h1,h2,h3{font-family:"Saira Condensed","Arial Narrow",system-ui,sans-serif;
  font-weight:600;margin:0;text-wrap:balance;letter-spacing:.01em}
h3{font-size:19px}
.mono{font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  font-variant-numeric:tabular-nums}
.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);
  font-weight:600;font-family:"IBM Plex Sans",sans-serif}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
.muted{color:var(--muted)}

/* ---- header ---------------------------------------------------------- */
header.top{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px 18px;align-items:end;
  padding-bottom:16px;border-bottom:2px solid var(--ink);margin-bottom:16px}
header.top h1{font-size:clamp(30px,5.4vw,48px);line-height:1;letter-spacing:-.01em}
.sub{color:var(--ink-2);max-width:64ch;margin:8px 0 0;font-size:14.5px}
.head-side{display:flex;flex-direction:column;align-items:flex-end;gap:12px}
.facts{display:flex;gap:18px;flex-wrap:wrap;justify-content:flex-end}
.fact{min-width:64px}
.fact b{display:block;font-family:"IBM Plex Mono",monospace;font-size:21px;font-weight:600;
  line-height:1.15;font-variant-numeric:tabular-nums}
.fact span{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
@media (max-width:760px){
  header.top{grid-template-columns:minmax(0,1fr);position:relative}
  .head-side{align-items:stretch}
  .facts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
  .fact{min-width:0}
  .fact b{font-size:18px}
  .fact span{font-size:9.5px;letter-spacing:.06em}
  #theme{position:absolute;top:0;right:0}
  header.top h1{padding-right:46px}
  #theme-l{display:none}
  .sub{font-size:14px}
}
.icon-btn{border:1px solid var(--line-2);background:var(--surface);color:var(--ink-2);
  border-radius:8px;padding:5px 10px;font-size:12.5px;cursor:pointer;display:inline-flex;gap:6px;
  align-items:center}
.icon-btn:hover{border-color:var(--accent);color:var(--accent)}

/* ---- panels ---------------------------------------------------------- */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.panel-h{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;
  justify-content:space-between;align-items:center;gap:8px 12px}
.panel-b{padding:14px}
.note{font-size:13px;color:var(--muted);padding:10px 14px;margin:0}
.empty{padding:26px 16px;color:var(--muted);font-size:14px;text-align:center}
.stack{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;min-width:0}
.stack > *,.cols2 > *,.subject > *{min-width:0}

/* ---- dataset bar ----------------------------------------------------- */
.dsbar{padding:12px 16px;margin-bottom:14px;display:grid;gap:8px}
.ds-row{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px}
.ds-row .season{display:flex;align-items:center;gap:8px}
.ds-row select{width:auto;min-width:110px}
.ds-blurb{margin:0;color:var(--ink-2);font-size:13.5px;max-width:90ch}
.status{font-size:12.5px;color:var(--muted)}
.status.err{color:var(--s1)}
.lacks{font-size:13px;color:var(--ink-2);border-left:3px solid var(--s2);padding:4px 0 4px 10px;
  background:transparent}
.lacks summary{cursor:pointer;color:var(--ink);font-weight:500}
.lacks p{margin:6px 0 0;color:var(--muted)}

/* ---- segmented controls & tabs --------------------------------------- */
.seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--line-2);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--raised);color:var(--ink-2);font-size:13px;
  padding:6px 12px;cursor:pointer;border-right:1px solid var(--line-2)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--accent);color:var(--on-accent);font-weight:600}
.seg button .via{font-size:11px;opacity:.75;margin-left:4px}
@media (max-width:620px){
  #srcseg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));width:100%}
  #srcseg button{padding:7px 6px;font-size:12.5px;line-height:1.25}
  #srcseg .via{display:block;margin:0;font-size:10.5px}
  .tabs button{padding:8px 9px 9px;font-size:14px;flex:1 1 auto}
}
@media (max-width:430px){.tabs .long{display:none}}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line-2);margin-bottom:16px;
  overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{border:0;background:none;padding:9px 14px 10px;font-size:15px;cursor:pointer;
  color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-1px;white-space:nowrap;
  font-family:"Saira Condensed",sans-serif;font-weight:600;letter-spacing:.02em}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tabs button:hover{color:var(--ink)}

/* ---- layout: filters beside the work --------------------------------- */
.layout{display:grid;grid-template-columns:270px minmax(0,1fr);gap:18px;align-items:start}
.layout > *{min-width:0}
@media (max-width:980px){.layout{grid-template-columns:minmax(0,1fr)}}
.filters-panel{position:sticky;top:12px}
@media (max-width:980px){.filters-panel{position:static}}
.filters-panel > details > summary{list-style:none;cursor:pointer;padding:12px 14px;display:flex;
  justify-content:space-between;align-items:center;gap:8px}
.filters-panel > details > summary::-webkit-details-marker{display:none}
.filters-panel > details[open] > summary{border-bottom:1px solid var(--line)}
.filters-panel .chev{transition:transform .15s;color:var(--muted)}
.filters-panel details[open] .chev{transform:rotate(180deg)}
.filters{display:grid;gap:13px;padding:14px}
.field{display:grid;gap:5px}
label,.lbl{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
input[type=search],select{
  width:100%;padding:8px 10px;border:1px solid var(--line-2);border-radius:7px;
  background:var(--raised);color:var(--ink);font:inherit;font-size:14px}
input[type=range]{width:100%;accent-color:var(--accent);margin:2px 0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip-btn{border:1px solid var(--line-2);background:var(--raised);color:var(--ink-2);font-size:12.5px;
  padding:4px 10px;border-radius:999px;cursor:pointer}
.chip-btn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.chk{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--ink-2);
  text-transform:none;letter-spacing:0;font-weight:400;cursor:pointer}
.chk input{accent-color:var(--accent);width:15px;height:15px;margin:0}
.fnote{font-size:12px;color:var(--muted);margin:0}
.count-pill{font-size:11.5px;font-weight:600;background:var(--accent);color:var(--on-accent);
  padding:1px 8px;border-radius:999px;font-family:"IBM Plex Sans",sans-serif;letter-spacing:0;
  text-transform:none}

/* ---- buttons --------------------------------------------------------- */
.tools{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.mini{border:1px solid var(--line-2);background:var(--raised);color:var(--ink-2);
  font-size:12.5px;padding:5px 11px;border-radius:7px;cursor:pointer;white-space:nowrap}
.mini:hover{border-color:var(--accent);color:var(--accent)}
.mini.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
.more{display:block;width:100%;border:0;border-top:1px solid var(--line);background:none;
  color:var(--accent);font-size:13.5px;font-weight:600;padding:10px;cursor:pointer}
.more:hover{background:var(--raised)}

/* ---- subject --------------------------------------------------------- */
.subject{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:18px;padding:16px;
  align-items:start}
@media (max-width:760px){.subject{grid-template-columns:minmax(0,1fr)}}
.pick{position:relative;display:grid;gap:5px}
.picker{position:absolute;top:100%;left:0;right:0;z-index:30;margin-top:4px;max-height:340px;
  overflow-y:auto;background:var(--surface);border:1px solid var(--line-2);border-radius:8px;
  box-shadow:var(--shadow)}
.prow{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);
  background:none;padding:8px 12px;cursor:pointer}
.prow:hover,.prow:focus-visible{background:var(--accent-soft)}
.prow .nm{font-family:"Saira Condensed",sans-serif;font-size:16px;font-weight:600}
.mt{display:block;font-size:12px;color:var(--muted)}
.who h2{font-size:clamp(26px,4.4vw,40px);line-height:1.02;margin-top:2px}
.badges{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.badge{font-size:12px;padding:3px 9px;border-radius:999px;border:1px solid var(--line-2);
  color:var(--ink-2);background:var(--raised);white-space:nowrap}
.badge.key{border-color:var(--accent);color:var(--accent);background:var(--accent-soft);font-weight:600}
.badge.arch{border-color:var(--ink);color:var(--ink);background:transparent;font-weight:600;
  font-family:"Saira Condensed",sans-serif;font-size:13.5px}
.seasons-line{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:10px;font-size:12.5px}
.seasons-line .chip-btn{font-family:"IBM Plex Mono",monospace;font-size:12px}

/* ---- two-up: radar + weights ------------------------------------------ */
.cols2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
@media (max-width:1180px){.cols2{grid-template-columns:minmax(0,1fr)}}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12.5px;color:var(--ink-2);padding:0 14px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;
  vertical-align:-1px}
.weights{display:grid;gap:9px;padding:14px}
.wrow{display:grid;grid-template-columns:132px minmax(0,1fr) 44px;gap:10px;align-items:center}
.wrow .wl{font-size:13px;color:var(--ink-2)}
.wrow .wv{font-size:12.5px;text-align:right}
.wrow.off .wl{color:var(--muted);text-decoration:line-through}

/* ---- lists: matches, results, leaderboard ------------------------------ */
.list{max-height:640px;overflow-y:auto}
.row{display:grid;grid-template-columns:26px minmax(0,1fr) auto 128px;gap:10px;align-items:center;
  width:100%;padding:9px 14px;border:0;border-bottom:1px solid var(--line);background:none;
  text-align:left;cursor:pointer}
.row:hover{background:var(--raised)}
.row[aria-current="true"]{background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent)}
.row .rk{color:var(--muted);font-size:12px;text-align:right}
.row .nm{font-family:"Saira Condensed",sans-serif;font-size:17px;font-weight:600;line-height:1.15}
.row .meta{font-size:12px;color:var(--ink-2);text-align:right;line-height:1.35;white-space:nowrap}
.score{display:grid;gap:3px;justify-items:end}
.score .tr{width:108px;height:6px;border-radius:4px;background:var(--line);overflow:hidden}
.score .fl{display:block;height:100%;background:var(--accent);border-radius:4px}
.score .pc{font-size:13px;font-weight:600;color:var(--accent)}
.row.brd{grid-template-columns:26px minmax(0,1fr) auto 46px}
.row.res{grid-template-columns:26px minmax(0,1fr) auto 56px}
.row .cells{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.row .bval{font-size:14px;font-weight:600;text-align:right;white-space:nowrap}
@media (max-width:620px){
  .row{grid-template-columns:22px minmax(0,1fr) 104px}
  .row .meta{display:none}
  .row.brd{grid-template-columns:22px minmax(0,1fr) auto 42px}
  .row.res{grid-template-columns:22px minmax(0,1fr) 52px}
  .row.res .cells{display:none}
  .score .tr{width:90px}
}

/* ---- profile search builder ------------------------------------------ */
.builder{display:grid;gap:10px;padding:14px}
.crit{display:grid;grid-template-columns:minmax(0,1fr) 150px 34px;gap:10px;align-items:center}
.crit .pv{font-size:12.5px}
.xbtn{border:1px solid var(--line-2);background:var(--raised);border-radius:7px;height:32px;
  cursor:pointer;color:var(--muted)}
.xbtn:hover{color:var(--s1);border-color:var(--s1)}
@media (max-width:560px){.crit{grid-template-columns:minmax(0,1fr) 34px}.crit .rng{grid-column:1/-1}}

/* ---- tables ---------------------------------------------------------- */
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px}
thead th{position:sticky;top:0;background:var(--surface);text-align:left;font-size:11px;
  letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600;
  padding:9px 10px;border-bottom:1px solid var(--line-2);white-space:nowrap}
thead tr.subh th{font-size:10px;letter-spacing:.06em;padding-top:0;padding-bottom:7px}
tbody td{padding:6px 10px;border-bottom:1px solid var(--line)}
tbody tr:hover{background:var(--raised)}
tbody tr.off .lb{color:var(--muted)}
tbody tr.here{background:var(--accent-soft)}
td.lb{min-width:180px}
td.num,th.num{text-align:right;font-family:"IBM Plex Mono",monospace;
  font-variant-numeric:tabular-nums;white-space:nowrap}
td.pcell{width:44px;padding-left:4px}
.chip{display:inline-block;min-width:30px;text-align:center;font-family:"IBM Plex Mono",monospace;
  font-size:11.5px;font-weight:600;padding:1px 5px;border-radius:5px;border:1px solid currentColor}
/* Percentile encoding: red through amber to green. Kept separate from the
   accent hue, because this scale IS the data rather than decoration. */
.c5{color:var(--s5)}.c4{color:var(--s4)}.c3{color:var(--s3)}.c2{color:var(--s2)}.c1{color:var(--s1)}
td.gap{width:88px}
.gbar{display:block;height:6px;border-radius:4px;background:var(--line);overflow:hidden}
.gbar span{display:block;height:100%;background:var(--s2);border-radius:4px}
.tag{display:inline-block;margin-left:7px;font-size:10px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--muted);border:1px solid var(--line-2);border-radius:4px;padding:0 4px}
.spark{display:inline-block;width:64px;height:8px;border-radius:4px;background:var(--line);
  overflow:hidden;vertical-align:middle;margin-right:6px}
.spark span{display:block;height:100%;border-radius:4px}

footer{margin-top:28px;padding-top:16px;border-top:1px solid var(--line);
  color:var(--muted);font-size:13px;display:grid;gap:9px}
footer a{color:var(--accent)}
footer b{color:var(--ink-2)}
svg{display:block;max-width:100%}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
