/* ---- how it works ----------------------------------------------------- */
.how-strip{display:flex;align-items:center;gap:16px;margin-bottom:14px;padding:14px 16px;
  border-radius:var(--r);background:var(--accent-soft);border:1px solid var(--line)}
.how-strip ol{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px 20px;margin:0;padding:0;
  list-style:none;counter-reset:step;flex:1}
.how-strip li{counter-increment:step;display:grid;grid-template-columns:auto minmax(0,1fr);column-gap:10px;
  font-size:13.5px;line-height:1.4}
.how-strip li::before{content:counter(step);grid-row:span 2;width:26px;height:26px;border-radius:50%;
  background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-weight:700;font-size:13px}
.how-strip li span{color:var(--ink-2)}
@media (max-width:760px){.how-strip{flex-direction:column;align-items:stretch}
  .how-strip ol{grid-template-columns:minmax(0,1fr)}}

.icon-btn{border:1px solid var(--line-2);background:var(--surface);color:var(--ink-2);
  border-radius:8px;padding:5px 10px;font-size:12.5px;cursor:pointer;display:inline-flex;gap:6px;
  align-items:center}
.icon-btn:hover{border-color:var(--accent);color:var(--accent)}

/* ---- panels ---------------------------------------------------------- */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--panel-shadow)}
.panel-h{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;
  justify-content:space-between;align-items:center;gap:8px 12px}
.panel-b{padding:14px}
.note{font-size:13px;color:var(--muted);padding:10px 14px;margin:0}
.empty{padding:26px 16px;color:var(--muted);font-size:14px;text-align:center}
.stack{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;min-width:0}
.stack > *,.cols2 > *,.subject > *{min-width:0}

/* ---- dataset bar ----------------------------------------------------- */
.dsbar{padding:12px 16px;margin-bottom:14px;display:grid;gap:8px}
.ds-row{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px}
.ds-row .season{display:flex;align-items:center;gap:8px}
.ds-row select{width:auto;min-width:110px}
.ds-blurb{margin:0;color:var(--ink-2);font-size:13.5px;max-width:90ch}
.status{font-size:12.5px;color:var(--muted)}

.lacks{font-size:13px;color:var(--ink-2);border-left:3px solid var(--s2);padding:4px 0 4px 10px;
  background:transparent}
.lacks summary{cursor:pointer;color:var(--ink);font-weight:500}
.lacks p{margin:6px 0 0;color:var(--muted)}

.ds-facts{display:flex;flex-wrap:wrap;gap:4px 16px;align-items:baseline;font-size:13px;color:var(--ink-2)}
.ds-facts b{font-family:"IBM Plex Mono",monospace;font-weight:600;color:var(--ink)}
.ds-more summary{cursor:pointer;font-size:13px;color:var(--accent);font-weight:500}
.ds-more .ds-blurb{margin-top:6px}

/* ---- segmented controls & tabs --------------------------------------- */
.seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--line-2);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--raised);color:var(--ink-2);font-size:13px;
  padding:6px 12px;cursor:pointer;border-right:1px solid var(--line-2)}
.seg button:last-child{border-right:0}

  #srcseg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));width:100%}

  #srcseg .via{display:block;margin:0;font-size:10.5px}
}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line-2);margin-bottom:16px;
  overflow-x:auto;scrollbar-width:none;position:sticky;top:0;z-index:25;background:var(--ground)}

.tabs button[aria-selected="true"] .ti{stroke:var(--accent)}

@media (max-width:620px){.tabs button{padding:8px 9px 9px;font-size:14px;flex:1 1 auto}}
.tabs .short{display:none}
@media (max-width:430px){.tabs .long{display:none}.tabs .short{display:inline}
  .tabs{gap:0}.tabs button{padding:7px 3px 8px;font-size:12.5px;flex-direction:column;gap:2px}
  .ti{width:18px;height:18px}}
