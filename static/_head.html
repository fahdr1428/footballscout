<title>Who Plays Like Him</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --ground:#EEF1F0; --surface:#FFFFFF; --raised:#F7F9F8;
  --ink:#101816; --ink-2:#3C4A46; --muted:#697B75; --line:#D8E0DD; --line-2:#C3CFCB;
  --accent:#12456B; --accent-soft:#E4EDF4; --on-accent:#FFFFFF;
  --s5:#1B7F4B; --s4:#5A9E4B; --s3:#9A9A72; --s2:#B26A00; --s1:#B3261E;
  --shadow:0 1px 2px rgba(16,24,22,.06),0 8px 24px rgba(16,24,22,.06);
  --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#0C1211; --surface:#131C1A; --raised:#18231F;
  --ink:#E9EFEC; --ink-2:#BCC9C4; --muted:#8CA09A; --line:#243330; --line-2:#33443F;
  --accent:#69B4DC; --accent-soft:#15303F; --on-accent:#08161D;
  --s5:#4FC98A; --s4:#8CC96B; --s3:#B9B57E; --s2:#E0913A; --s1:#E4685C;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35);
}}
:root[data-theme="dark"]{
  --ground:#0C1211; --surface:#131C1A; --raised:#18231F;
  --ink:#E9EFEC; --ink-2:#BCC9C4; --muted:#8CA09A; --line:#243330; --line-2:#33443F;
  --accent:#69B4DC; --accent-soft:#15303F; --on-accent:#08161D;
  --s5:#4FC98A; --s4:#8CC96B; --s3:#B9B57E; --s2:#E0913A; --s1:#E4685C;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
body{
  margin:0;background:var(--ground);color:var(--ink);
  font-family:"IBM Plex Sans",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;
}
.wrap{max-width:1340px;margin:0 auto;padding-inline:20px;padding-block:26px 44px}
h1,h2,h3{font-family:"Saira Condensed","Arial Narrow",system-ui,sans-serif;
  font-weight:600;margin:0;text-wrap:balance;letter-spacing:.01em}
.mono{font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  font-variant-numeric:tabular-nums}
.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);
  font-weight:600;font-family:"IBM Plex Sans",sans-serif}

/* header */
header{display:flex;flex-wrap:wrap;gap:18px;align-items:flex-end;justify-content:space-between;
  padding-bottom:18px;border-bottom:2px solid var(--ink);margin-bottom:22px}
header h1{font-size:clamp(30px,5vw,46px);line-height:1;letter-spacing:-.01em}
.sub{color:var(--ink-2);max-width:62ch;margin-top:8px;font-size:14.5px}
.facts{display:flex;gap:22px;flex-wrap:wrap}
.fact{min-width:74px}
.fact b{display:block;font-family:"IBM Plex Mono",monospace;font-size:22px;font-weight:600;
  line-height:1.15;font-variant-numeric:tabular-nums}
.fact span{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}

/* layout */
.cols{display:grid;grid-template-columns:minmax(0,360px) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:900px){.cols{grid-template-columns:1fr}}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.panel-h{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;
  justify-content:space-between;align-items:baseline;gap:6px 12px}
.panel-h .eyebrow{text-align:right}

/* filters */
.filters{display:grid;gap:10px;padding:14px}
.field{display:grid;gap:5px}
label{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
input[type=search],select{
  width:100%;padding:8px 10px;border:1px solid var(--line-2);border-radius:7px;
  background:var(--raised);color:var(--ink);font:inherit;font-size:14px}
input[type=range]{width:100%;accent-color:var(--accent)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* dataset switcher */
.datasets{padding:14px 18px;margin-bottom:14px;display:grid;gap:9px}
.ds-head{display:flex;flex-wrap:wrap;align-items:center;gap:12px}
.ds-blurb{margin:0;color:var(--ink-2);font-size:13.5px;max-width:78ch}
.datasets .seg{flex-wrap:wrap}
.datasets .seg button{font-size:13px;padding:6px 13px}

/* subject bar */
.subject-bar{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:20px;
  padding:16px 18px;align-items:start;margin-bottom:18px}
@media (max-width:760px){.subject-bar{grid-template-columns:1fr}}
.pick{position:relative;display:grid;gap:5px}
.picker{position:absolute;top:100%;left:0;right:0;z-index:20;margin-top:4px;max-height:320px;
  overflow-y:auto;background:var(--surface);border:1px solid var(--line-2);border-radius:8px;
  box-shadow:var(--shadow)}
.prow{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);
  background:none;color:inherit;font:inherit;padding:8px 12px;cursor:pointer}
.prow:hover{background:var(--accent-soft)}
.prow .nm{font-family:"Saira Condensed",sans-serif;font-size:16px;font-weight:600}
.prow .mt,.mrow .mt{display:block;font-size:12px;color:var(--muted)}
.subject-line .who-name h2{font-size:clamp(26px,4.4vw,40px);line-height:1.02;margin-top:2px}
.badges{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.badge{font-size:12px;padding:3px 9px;border-radius:999px;border:1px solid var(--line-2);
  color:var(--ink-2);background:var(--raised);white-space:nowrap}
.badge.key{border-color:var(--accent);color:var(--accent);background:var(--accent-soft);font-weight:600}
.badge.arch{border-color:var(--ink);color:var(--ink);background:transparent;font-weight:600;
  font-family:"Saira Condensed",sans-serif;font-size:13.5px}

.checks{display:flex;flex-wrap:wrap;gap:14px;padding-top:2px}
.chk{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--ink-2);
  text-transform:none;letter-spacing:0;font-weight:400;cursor:pointer}
.chk input{accent-color:var(--accent);width:15px;height:15px}

/* match list */
.matches{max-height:620px;overflow-y:auto}
.mrow{display:grid;grid-template-columns:26px minmax(0,1fr) auto 132px;gap:10px;align-items:center;
  width:100%;padding:9px 14px;border:0;border-bottom:1px solid var(--line);background:none;
  color:inherit;font:inherit;text-align:left;cursor:pointer}
.mrow:hover{background:var(--raised)}
.mrow[aria-current="true"]{background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent)}
.mrow .rk{color:var(--muted);font-size:12px;text-align:right}
.mrow .nm{font-family:"Saira Condensed",sans-serif;font-size:17px;font-weight:600;line-height:1.15}
.mrow .meta{font-size:12px;color:var(--ink-2);text-align:right;line-height:1.35;white-space:nowrap}
.mrow .score{display:grid;gap:3px;justify-items:end}
.mrow .score .tr{width:110px;height:6px;border-radius:4px;background:var(--line);overflow:hidden}
.mrow .score .fl{display:block;height:100%;background:var(--accent);border-radius:4px}
.mrow .score .pc{font-size:13px;font-weight:600;color:var(--accent)}
@media (max-width:620px){
  .mrow{grid-template-columns:22px minmax(0,1fr) 108px}
  .mrow .meta{display:none}
}

/* comparison table */
#compare-panel{margin-top:18px}
.seg{display:flex;gap:0;border:1px solid var(--line-2);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--raised);color:var(--ink-2);font:inherit;font-size:12.5px;
  padding:5px 11px;cursor:pointer;border-right:1px solid var(--line-2)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--accent);color:var(--on-accent);font-weight:600}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px}
thead th{position:sticky;top:0;background:var(--surface);text-align:left;font-size:11px;
  letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600;
  padding:9px 10px;border-bottom:1px solid var(--line-2);white-space:nowrap}
thead tr.sub th{font-size:10px;letter-spacing:.06em;padding-top:0;padding-bottom:7px;
  border-bottom:1px solid var(--line-2);color:var(--line-2)}
tbody td{padding:6px 10px;border-bottom:1px solid var(--line)}
tbody tr:hover{background:var(--raised)}
tbody tr.off .lb{color:var(--muted)}
td.lb{min-width:190px}
td.num,th.num{text-align:right;font-family:"IBM Plex Mono",monospace;
  font-variant-numeric:tabular-nums;white-space:nowrap}
td.pcell{width:44px;padding-left:4px}
.chip{display:inline-block;min-width:30px;text-align:center;font-family:"IBM Plex Mono",monospace;
  font-size:11.5px;font-weight:600;padding:1px 5px;border-radius:5px;border:1px solid currentColor}
/* Percentile encoding: red through amber to green. Kept separate from the
   accent hue, because this scale IS the data rather than decoration. */
.c5{color:var(--s5)}.c4{color:var(--s4)}.c3{color:var(--s3)}
.c2{color:var(--s2)}.c1{color:var(--s1)}
td.gap{width:88px}
.gbar{display:block;height:6px;border-radius:4px;background:var(--line);overflow:hidden}
.gbar span{display:block;height:100%;background:var(--s2);border-radius:4px}
.tag{display:inline-block;margin-left:7px;font-size:10px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--muted);border:1px solid var(--line-2);border-radius:4px;padding:0 4px}
.muted{color:var(--muted)}

.note{font-size:13px;color:var(--muted);padding:11px 16px}
footer{margin-top:30px;padding-top:18px;border-top:1px solid var(--line);
  color:var(--muted);font-size:13px;display:grid;gap:9px}
footer a{color:var(--accent)}
footer b{color:var(--ink-2)}
.empty{padding:24px 16px;color:var(--muted);font-size:14px;text-align:center}
svg{display:block;max-width:100%}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
